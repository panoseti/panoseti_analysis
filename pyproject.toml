[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "panoseti-zarr-pipeline"
version = "0.3.0"
description = "Nextflow 26 pipeline: PanoSETI PFF → Zarr v3 conversion + calibration"
requires-python = ">=3.11"
authors = [
    { name = "Nicolas Rault-Wang", email = "nraultwang@berkeley.edu" }
]
dependencies = [
    "pypff[zarr]",
    "typer>=0.9.0",
    "xarray>=2024.1",
    "zarr>=3.0",
    "matplotlib>=3.7",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["panoseti_zarr_pipeline*"]

[tool.uv.sources]
pypff = { path = "../pypff", editable = true }

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]
