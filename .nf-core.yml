repository_type: pipeline

nf_core_version: 4.0.2

lint:
  meta_yml_exists: false
  subworkflow_include: false
  main_nf_include_used: false
  subworkflow_version: false
  local_component_structure: false
  template_strings:
    - docs/plans/nextflow-modernization.md
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - .github/workflows/linting.yml
    - assets/nf-core-analysis_logo_light.png
    - docs/images/nf-core-analysis_logo_light.png
    - docs/images/nf-core-analysis_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - .prettierignore
    - .prettierignore
    - docs/CONTRIBUTING.md
    - assets/sendmail_template.txt
  nextflow_config:
    - manifest.name
    - manifest.homePage
    - process.cpus
    - process.memory
    - process.time
    - custom_config
    - params.custom_config_version
    - params.custom_config_base
  multiqc_config: false
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-analysis_logo_light.png
    - docs/images/nf-core-analysis_logo_light.png
    - docs/images/nf-core-analysis_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - assets/email_template.html
    - assets/sendmail_template.txt
    - assets/email_template.txt
    - conf/igenomes.config
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - CITATIONS.md
    - assets/multiqc_config.yml
  readme:
    - nextflow_badge
    - nfcore_template_badge
  included_configs: false

template:
  org: panoseti
  name: analysis
  description: PANOSETI PFF to Zarr ingest/calibration pipeline (HPC + real-time).
  author: Nicolas Rault-Wang
  version: 0.1.0
  force: true
  outdir: /tmp/pa_nfcore
  skip_features:
    - igenomes
    - multiqc
    - fastqc
    - email
  is_nfcore: false
