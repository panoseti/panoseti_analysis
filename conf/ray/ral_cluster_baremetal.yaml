# ⚠️  DEPRECATED — do NOT use `ray up` for RAL. Use `cluster/ral_up.sh` instead.
# Node labels here are stale. Current topology: 2× A6000 GPU nodes + 3 CPU nodes.
# The GAMING label no longer exists. See docs/training_ral.md for current topology.
#
# Ray's local provider gives the head + workers ONE shared node type and caps its worker
# quota at len(worker_ips), so the head consumes a slot and only len(worker_ips)-1 workers
# ever launch (digilab-transmit is the casualty — `min_workers: 5` below is silently clamped
# to 4, so the workaround cannot work). This fixed-size cluster needs no autoscaler; every
# node is started explicitly with deterministic GPU labels by cluster/ral_up.sh. See
# docs/training_ral.md. This file is retained only as a record of per-node setup_commands.
#
# PANOSETI RAL Ray Cluster — 5-node bare-metal configuration
#
# Runs Ray directly on the host Python (conda env 'drp', Python 3.14) — no Docker.
# Each node's ~/.bashrc ends with `conda activate drp`, which Ray's SSH sessions
# inherit via `bash --login -c -i 'source ~/.bashrc; ...'`.
#
# Use this if Docker is unavailable or if you prefer to avoid image management.
# See ral_cluster.yaml for the Docker variant (Python 3.13, py313-gpu image).
#
# Usage:
#   ray up conf/ray/ral_cluster_baremetal.yaml
#   ray up conf/ray/ral_cluster_baremetal.yaml --no-restart
#   ray status
#   ray down conf/ray/ral_cluster_baremetal.yaml
#
# Dashboard: http://digilab-receiver:8265
# Prometheus / Grafana: cd cluster/monitoring && docker compose up -d

cluster_name: pseti-ral

# ── Provider ───────────────────────────────────────────────────────────────────
provider:
  type: local
  head_ip: digilab-receiver
  worker_ips:
    - 10.0.1.34 # digilab-transmit — explicit IP avoids hostname-resolution flakiness under autoscaler v2
    - panoseti-dfs2
    - panoseti-dfs1
    - panoseti-dfs0

# ── Auth ───────────────────────────────────────────────────────────────────────
auth:
  ssh_user: nico
  ssh_private_key: ~/.ssh/id_ed25519

# ── Cluster size ───────────────────────────────────────────────────────────────
# Autoscaler v2 counts the head node as 1 toward the total.  With 4 worker IPs,
# min_workers: 5 = 1 head + 4 workers ensures all nodes start proactively.
# (min_workers: 4 only starts 3 workers; digilab-transmit stays idle until demand.)
min_workers: 5
max_workers: 5
idle_timeout_minutes: 0

# ── File sync ──────────────────────────────────────────────────────────────────
file_mounts:
  "/home/nico/panoseti_analysis": "/home/nico/panoseti_analysis"

rsync_exclude:
  - "**/.git"
  - "**/.git/**"
  # Belt-and-suspenders for the rsync_filter:.gitignore guard below. Relying on .gitignore
  # ALONE to keep 100+ GB off every worker is fragile (one un-ignored large dir → a
  # multi-GB rsync to all 4 nodes on every `ray up`). These patterns match by final path
  # component (no leading slash) except the anchored ml/* ones.
  - "work" # ~118 GB Nextflow work dir
  - ".venv" # ~6 GB local virtualenv
  - ".mypy_cache"
  - ".ruff_cache"
  - ".claude"
  - "__pycache__"
  - ".ipynb_checkpoints"
  - "*.zarr" # demo/test stores; workers read zarr from BeeGFS
  - "results"
  - "results_*"
  - "ml/*/data" # ~40 GB cloud-detection demo data
  - "ml/*/cache"
  - "ml/*/models"
  - "assets/models/cloud-detection-training"

rsync_filter:
  - ".gitignore"

file_mounts_sync_continuously: False

initialization_commands: []

# ── Package setup ──────────────────────────────────────────────────────────────
# Runs on the host (conda env 'drp').  pypff installed first — not on PyPI.
# --no-deps on panoseti_analysis: drp conda env already has all transitive deps;
# skipping re-download prevents pip from pulling ray[train], torch+CUDA (~15 GB)
# onto CPU-only dfs nodes and filling their root partition.
# --no-cache-dir: avoids accumulating pip download cache across ray-up runs.
setup_commands:
  # uv is used by Ray's runtime_env to build the per-job venv on each worker node.
  # Without it, background PG-cleaner actors fail to start, leaving stale placement
  # groups after training that hold GPUs and require manual cleanup.
  - pip install --quiet --no-cache-dir uv
  - pip install --quiet --no-cache-dir -e "/home/nico/panoseti_analysis/pypff[zarr]"
  - pip install --quiet --no-cache-dir -e /home/nico/panoseti_analysis --no-deps

head_setup_commands: []
worker_setup_commands: []

# ── Ray start commands ─────────────────────────────────────────────────────────
head_start_ray_commands:
  - ray stop
  - >-
    GPU_COUNT=$(nvidia-smi -L 2>/dev/null | wc -l || echo 0) &&
    ulimit -c unlimited &&
    ray start --head --port=6379
    --dashboard-host=0.0.0.0
    --num-gpus=$GPU_COUNT
    --autoscaling-config=~/ray_bootstrap_config.yaml

worker_start_ray_commands:
  - ray stop
  - >-
    GPU_COUNT=$(nvidia-smi -L 2>/dev/null | wc -l || echo 0) &&
    ray start --address=$RAY_HEAD_IP:6379
    --num-gpus=$GPU_COUNT
