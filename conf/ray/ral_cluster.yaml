# PANOSETI RAL Ray Cluster — 5-node bare-metal configuration
#
# Runs Ray directly on the host Python (conda env 'drp', Python 3.14) — no Docker.
# Each node's ~/.bashrc ends with `conda activate drp`, which Ray's SSH sessions inherit.
#
# Usage:
#   ray up conf/ray/ral_cluster.yaml           # start / update cluster
#   ray up conf/ray/ral_cluster.yaml --no-restart  # reconnect without restarting Ray
#   ray status                                 # check node status
#   ray down conf/ray/ral_cluster.yaml         # stop cluster (prefer keeping alive)
#
# Dashboard: http://digilab-receiver:8265
# Prometheus / Grafana: cd ~/ray-test && docker compose up -d
#   (Grafana at http://digilab-receiver:3000)
#
# NOTE: Do NOT add a `docker:` block.  rayproject/ray:*-gpu ships Python 3.10 which
# cannot install zarr>=3.0 (requires Python>=3.11).  Bare-metal avoids the mismatch.

cluster_name: pseti-ral

# ── Provider ───────────────────────────────────────────────────────────────────
provider:
    type: local
    head_ip: digilab-receiver        # 2× RTX A6000 48 GB; hosts prometheus/grafana
    worker_ips:
        - panoseti-dfs0              # BeeGFS storage — CPU only
        - panoseti-dfs1              # BeeGFS storage — CPU only
        - panoseti-dfs2              # BeeGFS storage — CPU only
        - digilab-transmit           # gaming GPU (accelerator_type:G) — Ray Serve

# ── Auth ───────────────────────────────────────────────────────────────────────
auth:
    ssh_user: nico
    ssh_private_key: ~/.ssh/id_ed25519

# ── Cluster size (fixed, no autoscaling) ───────────────────────────────────────
# Autoscaler v2 with the local provider counts the head node toward the min_workers
# budget, so to get head + 4 workers = 5 total nodes, set min=max=5.
# Workers are never stopped automatically — cluster stays alive indefinitely.
min_workers: 5
max_workers: 5

# Disable the idle worker shutdown that Ray enables by default (5 min).
# Setting to 0 keeps all workers alive regardless of load.
idle_timeout_minutes: 0

# ── File sync ──────────────────────────────────────────────────────────────────
# Rsyncs source from the launching machine to each worker host before setup_commands.
# gitignore is respected (rsync_filter below) — large data files are excluded.
file_mounts:
    "/home/nico/panoseti_analysis": "/home/nico/panoseti_analysis"

rsync_exclude:
    - "**/.git"
    - "**/.git/**"

rsync_filter:
    - ".gitignore"   # excludes: *.zip, *.zarr/, ml/*/cache/, etc.

file_mounts_sync_continuously: False

initialization_commands: []

# ── Package setup ──────────────────────────────────────────────────────────────
# Runs on every node (host Python, conda env 'drp') after rsync.
# pypff is a local uv workspace member — not on PyPI.  Must be installed before
# panoseti_analysis so pip resolves pypff[zarr] locally instead of hitting PyPI.
setup_commands:
    - pip install --quiet -e "/home/nico/panoseti_analysis/pypff[zarr]"
    - pip install --quiet -e /home/nico/panoseti_analysis

head_setup_commands: []
worker_setup_commands: []

# ── Ray start commands ─────────────────────────────────────────────────────────
head_start_ray_commands:
    - ray stop
    - >-
      GPU_COUNT=$(nvidia-smi -L 2>/dev/null | wc -l || echo 0) &&
      ulimit -c unlimited &&
      ray start --head --port=6379
      --dashboard-host=0.0.0.0
      --num-gpus=$GPU_COUNT
      --resources='{"accelerator_type:G": 1}'
      --autoscaling-config=~/ray_bootstrap_config.yaml

worker_start_ray_commands:
    - ray stop
    - >-
      GPU_COUNT=$(nvidia-smi -L 2>/dev/null | wc -l || echo 0) &&
      EXTRA=$(case $(hostname) in
          digilab-transmit) echo '{"accelerator_type:G": 1}' ;;
          *) echo '{}' ;;
      esac) &&
      ray start --address=$RAY_HEAD_IP:6379
      --num-gpus=$GPU_COUNT
      --resources="$EXTRA"
