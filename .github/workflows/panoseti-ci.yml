name: panoseti-ci

# Authoritative CI for the PANOSETI analysis package + ingest pipeline.
# See .github/workflows/linting.yml for NF/pre-commit linting and nf-test.yml for pipeline tests.
#
# Linting philosophy:
#   - Ruff (style): non-blocking — annotates lines in PRs but does not block merges.
#     Comment `@panoseti-bot fix linting` on the PR to auto-apply ruff --fix.
#   - Mypy (types): blocking — type errors indicate correctness bugs, not style.
#   - Pytest: blocking.

on:
  push:
    branches: [main, develop, refactor]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: ruff (annotations) + mypy (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      # Ruff: annotates PR lines but does NOT block merges.
      # Use `@panoseti-bot fix ruff` comment or run `uv run ruff check --fix src tests` locally.
      - name: Ruff check (annotations, non-blocking)
        run: uv run ruff check src tests --output-format github
        continue-on-error: true

      - name: Ruff format check (annotations, non-blocking)
        run: uv run ruff format --check src tests
        continue-on-error: true

      # Mypy: blocks merges. Type errors are correctness bugs.
      - name: Mypy (strict)
        run: uv run mypy src/panoseti_analysis

  python-test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Pytest (kernels, io, adapters, integration smoke)
        run: uv run pytest tests -q -m "not slow and not ral_only"

  pipeline:
    name: ingest smoke + chunk-size gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Nextflow (>=26.04)
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
      - name: Ingest smoke (test,laptop) on bundled obs_TEST
        run: nextflow run . -profile test,laptop --outdir results_ci
      - name: Lustre small-file guard (L0 images chunks)
        run: uv run python scripts/check_chunk_sizes.py results_ci/L0
      - name: Assert level-major outputs exist
        run: |
          test -f results_ci/L0/manifest.json
          test -f results_ci/L1/manifest.json
          ls results_ci/L0/*.zarr >/dev/null
          ls results_ci/L1/*.L1.zarr >/dev/null

# NOTE: the pypff submodule URL in .gitmodules is SSH (git@github.com:panoseti/pypff).
# For CI submodule checkout, either make pypff public + switch the URL to HTTPS, or add a
# deploy key / SSH secret to the checkout step.
