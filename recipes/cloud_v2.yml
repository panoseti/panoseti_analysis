name: cloud_v2
# Cloud detector v2 — PRODUCTION recipe. Full training: 50 epochs, A6000 GPUs (accelerator_type:G).
# Labels come from pa-prep-cloud-labels (batch ZIPs → interval CSV).
# For quick notebook iteration use: ml/cloud-detection/recipes/cloud_v2.yml
feature_cadence_s: 10.0    # match original batch-builder 10s sampling resolution
window_s: 60.0             # lookback window for the differential channel
n_stack: 10                # frames stacked per integration point
threshold: 0.5
split:
  test_prop: 0.15
  val_prop: 0.10
  boundary_prop: 0.20
  seed: 35
hyperparams:
  lr: 0.001
  batch_size: 128
  epochs: 50
  weight_decay: 0.00001
  gamma: 0.9
scaling:
  num_workers: 2
  accelerator_type: "G"
model_out_dir: "models/cloud_v2"
cloud_model_pt: null
cloud_model_json: null
