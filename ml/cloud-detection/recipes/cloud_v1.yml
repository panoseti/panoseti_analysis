name: cloud_v1
# Cloud detector — DEV / notebook recipe.  Quick iteration: fewer epochs, any-G GPU.
# For production full training (50 epochs, A6000 GPUs) use: recipes/cloud_v1.yml
wandb_entity: "nraultwang-mit-massachusetts-institute-of-technology"
feature_cadence_s: 60.0
threshold: 0.5
split:
  test_prop: 0.15
  val_prop: 0.10
  boundary_prop: 0.20
  seed: 35
hyperparams:
  lr: 0.001
  batch_size: 128
  epochs: 10
  weight_decay: 0.00001
  gamma: 0.9
scaling:
  num_workers: 2
  # RTX pins training to digilab-receiver (A6000s), where the local feature
  # cache zarr lives.  Use "G" only after moving CACHE_ZARR to BeeGFS.
  accelerator_type: "RTX"
model_out_dir: "models/cloud_v1"
cloud_model_pt: null # filled at inference time pointing to BeeGFS bundle
cloud_model_json: null
