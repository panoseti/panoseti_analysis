# RAL Ray cluster — node table + tunables.  Edit THIS file, not the scripts.
#
#   bash cluster/ral_up.sh        # bring the whole cluster up (run from the head)
#   bash cluster/ral_down.sh      # ray stop on every node
#
# Why a script instead of `ray up`: the Ray local provider gives the head and all
# workers one shared node type and caps its worker quota at len(worker_ips), so the
# head consumes a slot and only len(worker_ips)-1 workers ever launch (digilab-transmit
# is the perennial casualty).  This fixed-size cluster needs no autoscaler, so we start
# every node explicitly with deterministic GPU resource labels.

# ── Tunables (KEY=value, no spaces) ──────────────────────────────────────────────
PORT=6379
SRC=/home/nico/panoseti_analysis
CONDA_SH=~/miniconda3/etc/profile.d/conda.sh
THRESHOLD_MB=50

# ── Nodes ────────────────────────────────────────────────────────────────────────
# role    ip          gpus  conda_env  accel_label   ("-" = no custom label)
head      10.0.1.14   2     drp        A6000
worker    10.0.1.34   2     drp        GAMING
worker    10.0.1.10   0     ray_env    -
worker    10.0.1.18   0     ray_env    -
worker    10.0.1.38   0     ray_env    -
